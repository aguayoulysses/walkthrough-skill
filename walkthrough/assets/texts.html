<!doctype html><html><head><meta charset="utf-8"><title>Messages</title>
<!-- Desktop Messages windows showing the two texts a website form sends: the customer's confirmation and the owner's lead alert.
     Wording must be the REAL templates from ~/Projects/happy-mouths/app/api/lead/[slug]/route.ts, with this prospect's name filled in.
     Query: biz, cust (full name), owner (first name), a (customer text), b (owner text), t1 / t2 = ms after load when each text arrives. Record with freeze: 'start'. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:linear-gradient(135deg,#27405f,#5a4a78 55%,#a2577a)}
.desk{display:flex;gap:44px;justify-content:center;align-items:flex-start;padding-top:74px}
.col{width:540px}.lbl{color:#fff;font-size:19px;font-weight:600;margin:0 0 12px 6px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.win{background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden;height:640px;display:flex;flex-direction:column}
.bar{height:54px;background:#f1f1f3;border-bottom:1px solid #d9d9dc;display:flex;align-items:center;padding:0 14px;gap:8px;flex:none}
.dot{width:12px;height:12px;border-radius:50%}.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.to{margin-left:14px;font-size:14px;color:#8e8e93}.to b{color:#111;font-weight:600;margin-left:6px}
.msgs{flex:1;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.h{font-size:12px;color:#8e8e93;text-align:center;margin-bottom:8px}.h b{font-weight:600}
.b{align-self:flex-start;max-width:86%;background:#e9e9eb;color:#111;font-size:21px;line-height:1.3;padding:13px 17px;border-radius:21px;border-bottom-left-radius:6px;display:none;transform-origin:0 100%}
.b.on{display:block;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
.d{font-size:11px;color:#8e8e93;margin-left:8px;display:none}.d.on{display:block}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.in{height:52px;border-top:1px solid #e3e3e6;display:flex;align-items:center;padding:0 16px;flex:none}.in div{flex:1;border:1px solid #d1d1d6;border-radius:16px;padding:7px 14px;color:#b0b0b5;font-size:14px}
</style></head><body><div class="desk">
<div class="col"><p class="lbl" id="l1"></p><div class="win" id="w1"><div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span class="to">From:<b id="f1"></b></span></div>
 <div class="msgs"><div class="h"><b>Text Message</b> · Today 9:41 AM</div><div class="b" id="b1"></div><div class="d" id="d1">Sent automatically, seconds after the form</div></div><div class="in"><div>Text Message</div></div></div></div>
<div class="col"><p class="lbl" id="l2"></p><div class="win" id="w2"><div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span class="to">From:<b id="f2"></b></span></div>
 <div class="msgs"><div class="h"><b>Text Message</b> · Today 9:41 AM</div><div class="b" id="b2"></div><div class="d" id="d2">Same minute the customer hit send</div></div><div class="in"><div>Text Message</div></div></div></div>
</div><script>
const q=new URLSearchParams(location.search),g=(k,d)=>q.get(k)||d,biz=g('biz','Your Business'),cust=g('cust','Maria Lopez'),owner=g('owner','the owner');
l1.textContent='What the customer gets';l2.textContent='What '+owner+' gets';f1.textContent=biz;f2.textContent='Website leads';
b1.textContent=g('a','');b2.textContent=g('b','');
setTimeout(()=>{b1.classList.add('on');d1.classList.add('on')},+g('t1',600));setTimeout(()=>{b2.classList.add('on');d2.classList.add('on')},+g('t2',3000));
</script></body></html>
